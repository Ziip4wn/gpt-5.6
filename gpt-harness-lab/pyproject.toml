[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-harness-lab"
version = "0.1.0"
description = "Mini-harness pédagogique pour expérimenter avec des modèles GPT"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GPT Harness Lab contributors" }]
dependencies = []

[project.optional-dependencies]
openai = ["openai"]
dev = ["ruff>=0.8"]

[project.scripts]
gpt-harness = "gpt_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

